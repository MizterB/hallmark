# To skip Mac signing set the repository variable MAC_SIGNING to 0; to remove it permanently follow the "Remove Mac signing" runbook.

name: sign-mac
run-name: sign ${{ inputs.source_repo }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      source_repo:
        required: true
        type: string
      source_run_id:
        required: true
        type: string
      source_run_attempt:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      source_ref:
        required: false
        type: string
        default: ""
      tag:
        required: true
        type: string
      mode:
        required: true
        type: string
      request_id:
        required: true
        type: string
      artifacts:
        required: true
        type: string

permissions: {}

concurrency:
  group: sign-mac-${{ inputs.request_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.gate.outputs.environment }}
      mode: ${{ steps.gate.outputs.mode }}
      source_repo: ${{ steps.gate.outputs.source_repo }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
      request_id: ${{ steps.gate.outputs.request_id }}
      retention_days: ${{ steps.gate.outputs.retention_days }}
      legs: ${{ steps.gate.outputs.legs }}
    steps:
      - name: Fetch hallmark at the commit this run started from
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD

      - name: Check the request
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          HALLMARK_POLICY: ${{ secrets.HALLMARK_POLICY }}
          HALLMARK_SOURCE_REPO: ${{ inputs.source_repo }}
          HALLMARK_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          HALLMARK_SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          HALLMARK_SOURCE_SHA: ${{ inputs.source_sha }}
          HALLMARK_SOURCE_REF: ${{ inputs.source_ref }}
          HALLMARK_TAG: ${{ inputs.tag }}
          HALLMARK_MODE: ${{ inputs.mode }}
          HALLMARK_REQUEST_ID: ${{ inputs.request_id }}
          HALLMARK_ARTIFACTS: ${{ inputs.artifacts }}
        run: python3 scripts/verify.py gate

  preflight:
    name: preflight
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 15
    environment: ${{ needs.verify.outputs.environment }}
    permissions:
      contents: read
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Fetch hallmark at the commit this run started from
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD

      - name: Is signing available
        id: check
        env:
          HALLMARK_POLICY: ${{ secrets.HALLMARK_POLICY }}
          HALLMARK_SOURCE_REPO: ${{ needs.verify.outputs.source_repo }}
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          HALLMARK_RELEASE_TOKEN: ${{ secrets.HALLMARK_RELEASE_TOKEN }}
        run: bash scripts/preflight.sh

      - name: Remove the throwaway keychain
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/hallmark-preflight/signing.keychain-db" >/dev/null 2>&1 || true
          rm -rf "${RUNNER_TEMP}/hallmark-preflight"

  signing-withdrawn:
    name: signing-withdrawn
    needs: [verify, preflight]
    if: ${{ needs.preflight.outputs.available == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Say so
        run: |
          echo "::warning title=Mac signing::Mac signing is withdrawn for this request, so the Mac builds will be unsigned. To skip Mac signing set the repository variable MAC_SIGNING to 0; to remove it permanently follow the \"Remove Mac signing\" runbook."

  sign:
    name: sign (${{ matrix.leg }})
    needs: [verify, preflight]
    if: ${{ success() && needs.preflight.outputs.available == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 120
    environment: ${{ needs.verify.outputs.environment }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        leg: ${{ fromJSON(needs.verify.outputs.legs) }}
    steps:
      - name: Fetch hallmark at the commit this run started from
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD

      - name: Check the request again and fetch this build
        env:
          GH_TOKEN: ${{ github.token }}
          HALLMARK_POLICY: ${{ secrets.HALLMARK_POLICY }}
          HALLMARK_LEG: ${{ matrix.leg }}
          HALLMARK_SOURCE_REPO: ${{ inputs.source_repo }}
          HALLMARK_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          HALLMARK_SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          HALLMARK_SOURCE_SHA: ${{ inputs.source_sha }}
          HALLMARK_SOURCE_REF: ${{ inputs.source_ref }}
          HALLMARK_TAG: ${{ inputs.tag }}
          HALLMARK_MODE: ${{ inputs.mode }}
          HALLMARK_REQUEST_ID: ${{ inputs.request_id }}
          HALLMARK_ARTIFACTS: ${{ inputs.artifacts }}
        run: python3 scripts/verify.py fetch --dest "${RUNNER_TEMP}/verified"

      - name: Sign, notarize and staple
        env:
          HALLMARK_LEG: ${{ matrix.leg }}
          HALLMARK_VERIFIED: ${{ runner.temp }}/verified
          HALLMARK_OUT: ${{ runner.temp }}/signed
          HALLMARK_REQUEST_ID: ${{ needs.verify.outputs.request_id }}
          HALLMARK_POLICY: ${{ secrets.HALLMARK_POLICY }}
          HALLMARK_SOURCE_REPO: ${{ needs.verify.outputs.source_repo }}
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: bash scripts/sign.sh

      - name: Remove the throwaway keychain
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/hallmark-${LEG}/signing.keychain-db" >/dev/null 2>&1 || true
          rm -rf "${RUNNER_TEMP}/hallmark-${LEG}" "${RUNNER_TEMP}/verified"
        env:
          LEG: ${{ matrix.leg }}

      - name: Hand the signed build to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hallmark-signed-${{ matrix.leg }}
          path: ${{ runner.temp }}/signed
          if-no-files-found: error
          retention-days: ${{ needs.verify.outputs.retention_days }}
          compression-level: 0

  publish:
    name: publish
    needs: [verify, preflight, sign]
    if: ${{ success() && needs.preflight.outputs.available == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    environment: ${{ needs.verify.outputs.environment }}
    permissions:
      contents: read
    steps:
      - name: Fetch hallmark at the commit this run started from
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD

      - name: Collect both signed builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hallmark-signed-*
          merge-multiple: true
          path: ${{ runner.temp }}/signed

      - name: Put the signed builds in a draft release
        env:
          GH_TOKEN: ${{ secrets.HALLMARK_RELEASE_TOKEN }}
          HALLMARK_SIGNED: ${{ runner.temp }}/signed
          HALLMARK_SOURCE_REPO: ${{ needs.verify.outputs.source_repo }}
          HALLMARK_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          HALLMARK_REQUEST_ID: ${{ needs.verify.outputs.request_id }}
          HALLMARK_POLICY: ${{ secrets.HALLMARK_POLICY }}
        run: bash scripts/publish.sh
